<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <meta name="description" content="Participe do sorteio do Tio Renato. Adquira agora os seus números.">
    <title>Sorteio do Tio Renato</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800;900&family=Poppins:wght@400&display=swap" rel="stylesheet">

    <!-- Banner principal carregado com prioridade -->
    <link rel="preload" as="image" href="assets/images/banner-renato.png" type="image/png">

    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css?v=15">
    <link rel="stylesheet" href="css/responsive.css?v=15">
</head>
<body>

    <!-- ===================== EFEITOS LUMINOSOS DE FUNDO ===================== -->
    <div class="ambient-glow" aria-hidden="true">
        <span class="glow-top-left"></span>
        <span class="glow-bottom-right"></span>
        <span class="orange-light-streak"></span>
    </div>

    <div class="page-wrapper">

        <main class="container">

            <!-- ============================ BANNER ============================ -->
            <section class="hero-section reveal">
                <div class="hero-banner">
                    <img id="hero-image"
                         src="assets/images/banner-renato.png"
                         alt="Sorteio do Tio Renato"
                         width="1448" height="1086"
                         fetchpriority="high"
                         decoding="async">
                    <!-- Exibido automaticamente enquanto o banner não for enviado -->
                    <div class="image-placeholder hero-placeholder" aria-hidden="true">
                        <i data-lucide="image"></i>
                        <span>Seu banner aqui</span>
                        <small>assets/images/banner-renato.png</small>
                    </div>
                </div>
            </section>

            <!-- ======================== BOTÃO PRINCIPAL ======================== -->
            <section class="cta-section reveal">

                <p class="cta-subtitle">
                    Participe do sorteio do Tio Renato
                </p>

                <a id="purchase-button"
                   class="cta-button"
                   href="#">

                    <span class="cta-text">
                        ADQUIRA AGORA OS SEUS NÚMEROS
                    </span>

                    <span class="cta-arrow" aria-hidden="true">→</span>

                </a>

            </section>

            <!-- ========================= PROVAS SOCIAIS ======================== -->
            <section class="social-proof-section reveal">

                <h2 class="section-title">
                    VEJA QUEM JÁ GANHOU
                </h2>

                <!-- Os cards são gerados automaticamente a partir de CONFIG.winners (js/config.js) -->
                <div class="winners-grid" id="winners-grid"></div>

            </section>

        </main>

        <!-- ============================= RODAPÉ ============================= -->
        <footer class="profile-footer reveal">

            <div class="profile-avatar-wrap">
                <img class="profile-avatar"
                     src="assets/images/perfil-renato.png"
                     alt="Tio Renato"
                     width="120" height="120"
                     loading="lazy"
                     decoding="async">
                <span class="avatar-fallback" aria-hidden="true">TR</span>
            </div>

            <div class="profile-info">

                <div class="profile-name-row">
                    <span class="profile-name">Tio Renato</span>

                    <!-- Selo de verificado (feito em SVG, não é imagem) -->
                    <svg class="verified-badge" viewBox="0 0 28 28" role="img" aria-label="Verificado">
                        <polygon points="14.00,1.40 18.06,4.21 22.91,5.09 23.79,9.94 26.60,14.00 23.79,18.06 22.91,22.91 18.06,23.79 14.00,26.60 9.94,23.79 5.09,22.91 4.21,18.06 1.40,14.00 4.21,9.94 5.09,5.09 9.94,4.21"
                                 fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
                        <path d="M9 14.4l3.3 3.3L19.2 10.6" fill="none" stroke="#fff" stroke-width="2.6"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>

                <!-- Apenas exibição: não é link, não sai da página -->
                <span class="instagram-handle">
                    <!-- Ícone do Instagram com degradê oficial (SVG, não é imagem) -->
                    <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <defs>
                            <radialGradient id="ig-gradient" cx="0.3" cy="1.07" r="1.25">
                                <stop offset="0" stop-color="#FFDD55"/>
                                <stop offset="0.1" stop-color="#FFDD55"/>
                                <stop offset="0.5" stop-color="#FF543E"/>
                                <stop offset="1" stop-color="#C837AB"/>
                            </radialGradient>
                        </defs>
                        <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#ig-gradient)"/>
                        <rect x="5.6" y="5.6" width="12.8" height="12.8" rx="4" fill="none" stroke="#fff" stroke-width="1.8"/>
                        <circle cx="12" cy="12" r="3.1" fill="none" stroke="#fff" stroke-width="1.8"/>
                        <circle cx="16.3" cy="7.7" r="1.05" fill="#fff"/>
                    </svg>
                    <span class="instagram-text">tiorenatoaqui</span>
                </span>

            </div>

        </footer>

    </div>

    <!-- ===================== NOTIFICAÇÕES (geradas pelo main.js) ===================== -->
    <div class="notify-root" id="notify-root" aria-live="polite" aria-atomic="true"></div>

    <!-- Ícones (Lucide) -->
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>

    <!-- Scripts do site -->
    <script src="js/config.js?v=15" defer></script>
    <script src="js/main.js?v=15" defer></script>
</body>
</html>
